version: "3.8"

services:
  app:
    build: .
    container_name: nemesisai-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - AI_INTEGRATIONS_OPENAI_API_KEY=${AI_INTEGRATIONS_OPENAI_API_KEY}
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS}
      - PREMIUM_EMAILS=${PREMIUM_EMAILS}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: nemesisai-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nemesis
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nemesis_secure_pw_2026}
      - POSTGRES_DB=nemesisai
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: nemesisai-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  pgdata:

version: "3.8"

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: nemesisai-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nemesis}:${POSTGRES_PASSWORD:-nemesis_secure_pw_2026}@db:5432/${POSTGRES_DB:-nemesisai}
      - SESSION_SECRET=${SESSION_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS:-}
      - PREMIUM_EMAILS=${PREMIUM_EMAILS:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - APP_DOMAIN=${APP_DOMAIN:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: nemesisai-db
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nemesis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nemesis_secure_pw_2026}
      - POSTGRES_DB=${POSTGRES_DB:-nemesisai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nemesis} -d ${POSTGRES_DB:-nemesisai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  proxy:
    image: caddy:2.10-alpine
    container_name: nemesisai-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
